# --- IMPORTANT: set this to "/<your-repo-name>" for a project site ---
#     e.g. if the repo is  cogmaster-maths-2026  ->  baseurl: "/cogmaster-maths-2026"
#     Leave it as "" only if you use a user/organisation site (<user>.github.io).
